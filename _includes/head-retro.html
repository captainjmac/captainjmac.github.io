<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        // Keep the HTML logo hidden while the WebGL scene loads, so it doesn't
        // flash up before the 3D logo. retro-scene.js reveals it if WebGL is
        // unavailable; this reveals it if the scene hasn't drawn a logo in 5s
        // (e.g. the CDN is unreachable).
        document.documentElement.classList.add('scene-pending');
        setTimeout(function () {
            if (!document.documentElement.classList.contains('webgl')) {
                document.documentElement.classList.remove('scene-pending');
            }
        }, 5000);
    </script>
    {%- seo -%}
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/jmac.css" | relative_url }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-color: black;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            body.page, html:has(body.page) {
                height: auto;
                min-height: 100%;
                overflow: visible;
            }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
    <!-- ?v= is the build time, so each deploy fetches fresh scene scripts
         despite the host's 4-hour browser cache. retro-scene.js passes it on
         to the modules it imports. -->
    <script type="module" src="{{ "/assets/js/retro-scene.js" | relative_url }}?v={{ site.time | date: '%s' }}"
            onerror="document.documentElement.classList.remove('scene-pending')"></script>

    {%- feed_meta -%}
    {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
    {%- endif -%}

    <!-- Cronitor RUM -->
    <script async src="https://rum.cronitor.io/script.js"></script>
    <script>
        window.cronitor = window.cronitor || function() { (window.cronitor.q = window.cronitor.q || []).push(arguments); };
        cronitor('config', { clientKey: '031069d89e6f2683b6a7713c5a51b7b9' });
    </script>

    {% include external-links.html %}
</head>
